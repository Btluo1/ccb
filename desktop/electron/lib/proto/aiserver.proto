message GetDiffResponse { // aiserver.v1.GetDiffResponse
		message GitDiff { // aiserver.v1.GitDiff
				message FileDiff { // aiserver.v1.FileDiff
						message Chunk { // aiserver.v1.FileDiff.Chunk
							string content = 1;
							repeated string lines = 2;
							int32 old_start = 3;
							int32 old_lines = 4;
							int32 new_start = 5;
							int32 new_lines = 6;
						}
					int32 added = 4;
					int32 removed = 5;
					string from = 1;
					string to = 2;
					repeated Chunk chunks = 3;
					optional string before_file_contents = 6;
					optional string after_file_contents = 7;
				}
				enum DiffType { // aiserver.v1.GitDiff.DiffType
					DIFF_TYPE_UNSPECIFIED = 0;
					DIFF_TYPE_DIFF_TO_HEAD = 1;
					DIFF_TYPE_DIFF_FROM_BRANCH_TO_MAIN = 2;
				}
			repeated FileDiff diffs = 1;
			DiffType diff_type = 2;
		}
		message SubmoduleDiff { // aiserver.v1.GetDiffResponse.SubmoduleDiff
				message GitDiff { // aiserver.v1.GitDiff
						message FileDiff { // aiserver.v1.FileDiff
								message Chunk { // aiserver.v1.FileDiff.Chunk
									string content = 1;
									repeated string lines = 2;
									int32 old_start = 3;
									int32 old_lines = 4;
									int32 new_start = 5;
									int32 new_lines = 6;
								}
							int32 added = 4;
							int32 removed = 5;
							string from = 1;
							string to = 2;
							repeated Chunk chunks = 3;
							optional string before_file_contents = 6;
							optional string after_file_contents = 7;
						}
						enum DiffType { // aiserver.v1.GitDiff.DiffType
							DIFF_TYPE_UNSPECIFIED = 0;
							DIFF_TYPE_DIFF_TO_HEAD = 1;
							DIFF_TYPE_DIFF_FROM_BRANCH_TO_MAIN = 2;
						}
					repeated FileDiff diffs = 1;
					DiffType diff_type = 2;
				}
			string relative_path = 1;
			GitDiff diff = 2;
			bool errored = 3;
		}
	GitDiff diff = 1;
	repeated SubmoduleDiff submodule_diffs = 2;
}

